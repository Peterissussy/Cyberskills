<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

<form action="https://formsubmit.co/founder@cyberskills.li" method="POST">
  <h2>Join the Waitlist</h2>

  <input 
    type="text" 
    name="name" 
    placeholder="Your name" 
    required 
    style="padding: 10px; width: 100%; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ccc;">

  <input 
    type="email" 
    name="email" 
    placeholder="Your email" 
    required 
    style="padding: 10px; width: 100%; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ccc;">

  <!-- Auto-response email -->
  <input type="hidden" name="_autoresponse" value="🎉 You're officially on the Cyberskills waitlist! We'll notify you first when early access opens. Stay tuned. 🚀">

  <!-- Optional redirect -->
  <input type="hidden" name="_next" value="https://cyberskills.li/thank-you">

  <!-- Optional: Honeypot spam protection -->
  <input type="text" name="_honey" style="display:none">

  <!-- Optional: Disable CAPTCHA (if needed) -->
  <input type="hidden" name="_captcha" value="false">

  <button 
    type="submit"
    style="background-color: black; color: white; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer;">
    Get Early Access
  </button>
</form>

</body>
</html>
